name: led_matrix_controller
description: Flutter app to control LED Matrix display through REST API

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  web_socket_channel: ^3.0.0
  cupertino_icons: ^1.0.2
  dynamic_color: ^1.8.1
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.1
  record: ^6.1.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
